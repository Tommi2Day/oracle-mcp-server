{{/* Oracle password / wallet password secret */}}
{{- if not .Values.oracle.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "oracle-mcp-server.fullname" . }}-oracle-credentials
  labels:
    {{- include "oracle-mcp-server.labels" . | nindent 4 }}
type: Opaque
stringData:
  password: {{ .Values.oracle.password | quote }}
  walletPassword: {{ .Values.oracle.walletPassword | quote }}
{{- end }}
---
{{/* Auth token secret (only if token set inline and no existingSecret) */}}
{{- if and (not .Values.auth.existingSecret) .Values.auth.token }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "oracle-mcp-server.fullname" . }}-auth
  labels:
    {{- include "oracle-mcp-server.labels" . | nindent 4 }}
type: Opaque
stringData:
  token: {{ .Values.auth.token | quote }}
{{- end }}
---
{{/* Token store encryption key (only if set inline) */}}
{{- if and (not .Values.auth.storeEncryptionKeySecret) .Values.auth.storeEncryptionKey }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "oracle-mcp-server.fullname" . }}-store-key
  labels:
    {{- include "oracle-mcp-server.labels" . | nindent 4 }}
type: Opaque
stringData:
  key: {{ .Values.auth.storeEncryptionKey | quote }}
{{- end }}
---
{{/* Inline TNS_ADMIN files (tnsnames.ora, sqlnet.ora, …) */}}
{{- if .Values.tnsAdmin.files }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "oracle-mcp-server.fullname" . }}-tns-admin
  labels:
    {{- include "oracle-mcp-server.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- range $name, $content := .Values.tnsAdmin.files }}
  {{ $name }}: {{ $content | quote }}
  {{- end }}
{{- end }}
---
{{/* Inline TLS cert/key for the HTTPS server (only if not using existingSecret) */}}
{{- if and (not .Values.tls.existingSecret) .Values.tls.cert .Values.tls.key }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "oracle-mcp-server.fullname" . }}-tls
  labels:
    {{- include "oracle-mcp-server.labels" . | nindent 4 }}
type: kubernetes.io/tls
data:
  tls.crt: {{ .Values.tls.cert }}
  tls.key: {{ .Values.tls.key }}
{{- end }}
