services:
  oracle-test:
    image: gvenzl/oracle-free:23-slim-faststart
    ports:
      - "${ORA_TEST_PORT:-1521}:1521"
    environment:
      ORACLE_PASSWORD: ${ORACLE_ADMIN_PASSWORD:-manager}
      APP_USER: ${ORA_USER:-mcp}
      APP_USER_PASSWORD: ${ORA_PASSWORD:-mcp_pw}
    healthcheck:
      test: ["CMD", "healthcheck.sh"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 20s
    networks:
      - mcp-net

  # OIDC identity provider for the OAuth integration tests (docker compose --profile oidc up -d oidc-test).
  # Issues tokens without a login screen; users/groups are defined in tests/oidc/mock-oauth2-config.json.
  # Run: OIDC_TEST_ISSUER=http://localhost:8080/default npx vitest run tests/oidc.integration.test.ts
  oidc-test:
    image: ghcr.io/navikt/mock-oauth2-server:2.1.10
    profiles: ["oidc"]
    ports:
      - "8080:8080"
    environment:
      SERVER_PORT: "8080"
      JSON_CONFIG_PATH: /config/config.json
    volumes:
      - ./tests/oidc/mock-oauth2-config.json:/config/config.json:ro
    networks:
      - mcp-net

  # Real OIDC provider with admin console and login page (docker compose --profile keycloak up -d keycloak).
  # Realm "oracle-mcp" is imported from tests/oidc/keycloak-realm.json: users alice/bob/eve/root (password = name,
  # groups grp-dba/grp-users/grp-other/grp-admin), clients oramcp-web (browser login) and oramcp-test (password grant).
  # Admin console: http://localhost:8081  (admin / admin). Issuer: http://localhost:8081/realms/oracle-mcp
  # Run: OIDC_TEST_ISSUER=http://localhost:8081/realms/oracle-mcp npx vitest run tests/oidc.integration.test.ts
  keycloak:
    image: quay.io/keycloak/keycloak:26.4
    profiles: ["keycloak"]
    command: ["start-dev", "--import-realm"]
    ports:
      - "8081:8080"
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_HEALTH_ENABLED: "true"
      # Token issuer is http://localhost:8081/...; the server container reaches Keycloak as keycloak:8080
      KC_HOSTNAME: http://localhost:8081
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
    volumes:
      - ./tests/oidc/keycloak-realm.json:/opt/keycloak/data/import/oracle-mcp.json:ro
    healthcheck:
      # The image has no curl: plain HTTP request to the management port
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/localhost/9000 && printf 'GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && grep -q '\"status\": \"UP\"' <&3"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s
    networks:
      - mcp-net

  oracle-mcp-server:
    build: .
    image: oracle-mcp-server:latest
    # Fixed hostname: it is written into the SAN of the self-signed cert, which is
    # persisted in mcp-certs — a random container ID would change on every re-create.
    hostname: ${MCP_HOSTNAME:-oracle-mcp-server}
    ports:
      - "${MCP_PORT:-3000}:3000"
    depends_on:
      oracle-test:
        condition: service_healthy
    environment:
      TRANSPORT: http
      PORT: 3000

      # ── TLS (HTTPS) ───────────────────────────────────────────────────────
      TLS_ENABLED: "${TLS_ENABLED:-false}"
      TLS_CERT_FILE: /certs/tls.crt
      TLS_KEY_FILE:  /certs/tls.key
      # TLS_CA_FILE: /certs/client-ca.crt
      # TLS_SAN: "${TLS_SAN:-}"

      # ── Server identity / logging ─────────────────────────────────────────
      MCP_SERVER_NAME: "${MCP_SERVER_NAME:-oracle-mcp-server}"
      LOG_LEVEL: "${LOG_LEVEL:-info}"
      # Admin UI branding (logo + colors), files from the /branding mount below
      ADMIN_THEME_CSS: "${ADMIN_THEME_CSS:-}"
      ADMIN_LOGO: "${ADMIN_LOGO:-}"

      # ── Authentication / token store ──────────────────────────────────────
      AUTH_TOKEN: "${AUTH_TOKEN:-}"
      TOKENS_FILE: /data/tokens.json
      STORE_ENCRYPTION_KEY: "${STORE_ENCRYPTION_KEY:-}"

      # ── Oracle (default / admin connection) ───────────────────────────────
      # Precedence: ORA_CONNECT_STRING > ORA_TNS_ALIAS > ORA_HOST/PORT/SERVICE_NAME
      ORA_CONNECT_STRING: "${ORA_CONNECT_STRING:-}"
      ORA_TNS_ALIAS: "${ORA_TNS_ALIAS:-}"
      ORA_HOST: "${ORA_HOST:-oracle-test}"
      ORA_PORT: "${ORA_PORT:-1521}"
      ORA_SERVICE_NAME: "${ORA_SERVICE_NAME:-FREEPDB1}"
      ORA_PROTOCOL: "${ORA_PROTOCOL:-tcp}"
      ORA_USER: "${ORA_USER:-mcp}"
      ORA_PASSWORD: "${ORA_PASSWORD:-mcp_pw}"
      ORA_DRIVER_MODE: "${ORA_DRIVER_MODE:-thin}"
      # Performance tools; enable the packs only when licensed
      ORA_PERF_TOOLS: "${ORA_PERF_TOOLS:-true}"
      ORA_DIAGNOSTICS_PACK: "${ORA_DIAGNOSTICS_PACK:-false}"
      ORA_TUNING_PACK: "${ORA_TUNING_PACK:-false}"
      # X-Oracle-* headers of AUTH_TOKEN clients: none | credentials | full
      ORA_CLIENT_CONNECTION: "${ORA_CLIENT_CONNECTION:-none}"

      # ── OAuth 2.0 / OIDC (Entra ID, …) — see docs/oauth.md; empty OAUTH_ISSUER = off ──
      OAUTH_ISSUER: "${OAUTH_ISSUER:-}"
      OAUTH_CLIENT_ID: "${OAUTH_CLIENT_ID:-}"
      OAUTH_CLIENT_SECRET: "${OAUTH_CLIENT_SECRET:-}"
      OAUTH_AUDIENCE: "${OAUTH_AUDIENCE:-}"
      OAUTH_PUBLIC_URL: "${OAUTH_PUBLIC_URL:-}"
      OAUTH_RESOURCE_SCOPES: "${OAUTH_RESOURCE_SCOPES:-}"
      # Explicit endpoints skip discovery, e.g. when the server reaches the provider under another name than the browser
      OAUTH_JWKS_URI: "${OAUTH_JWKS_URI:-}"
      OAUTH_AUTHORIZATION_ENDPOINT: "${OAUTH_AUTHORIZATION_ENDPOINT:-}"
      OAUTH_TOKEN_ENDPOINT: "${OAUTH_TOKEN_ENDPOINT:-}"
      OAUTH_GROUPS_CLAIM: "${OAUTH_GROUPS_CLAIM:-}"
      OAUTH_ALLOWED_GROUPS: "${OAUTH_ALLOWED_GROUPS:-}"
      OAUTH_ALLOWED_USERS: "${OAUTH_ALLOWED_USERS:-}"
      OAUTH_ADMIN_GROUPS: "${OAUTH_ADMIN_GROUPS:-}"
      OAUTH_ADMIN_USERS: "${OAUTH_ADMIN_USERS:-}"
      OAUTH_ASSIGNMENTS: "${OAUTH_ASSIGNMENTS:-}"
      # TNS_ADMIN is preset in the image to /opt/oracle/network/admin

    volumes:
      - mcp-data:/data               # persist token store (tokens.json)
      - mcp-certs:/certs             # persist TLS certs (self-signed cert is generated here on first start)
      # tnsnames.ora, sqlnet.ora and wallets (read-only)
      - ${TNS_ADMIN_DIR:-./examples/tns_admin}:/opt/oracle/network/admin:ro
      # admin UI theme.css / logo (ADMIN_THEME_CSS, ADMIN_LOGO)
      - ${BRANDING_DIR:-./examples/admin-theme}:/branding:ro

    networks:
      - mcp-net

    restart: unless-stopped

networks:
  mcp-net:
    driver: bridge

volumes:
  mcp-data:
  mcp-certs:
