name: Helm Chart

# Publishes the Helm chart as an OCI artifact:
#   helm install oracle-mcp oci://ghcr.io/tommi2day/charts/oracle-mcp-server --version <tag>
# Called by the Release workflow after the git tag exists; can also be run manually for an existing tag.

on:
  workflow_call:
    inputs:
      tag:
        description: "Version / git tag to publish (e.g. 1.2.3)"
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing git tag to publish as chart version (e.g. 1.2.3)"
        required: true
        type: string

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  publish:
    name: Publish chart to ghcr.io
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Validate tag
        env:
          TAG: ${{ inputs.tag }}
        run: |
          if ! echo "$TAG" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::Invalid tag '$TAG' (expected MAJOR.MINOR.PATCH)"
            exit 1
          fi

      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag }}

      - name: Lint chart
        run: helm lint helm/oracle-mcp-server

      - name: Package chart
        env:
          TAG: ${{ inputs.tag }}
        run: helm package helm/oracle-mcp-server --version "$TAG" --app-version "$TAG" --destination "$RUNNER_TEMP/chart"

      - name: Log in to ghcr.io
        env:
          GH_TOKEN: ${{ github.token }}
          ACTOR: ${{ github.actor }}
        run: echo "$GH_TOKEN" | helm registry login ghcr.io --username "$ACTOR" --password-stdin

      - name: Push chart
        env:
          TAG: ${{ inputs.tag }}
          OWNER: ${{ github.repository_owner }}
        run: |
          OWNER=$(echo "$OWNER" | tr '[:upper:]' '[:lower:]')
          helm push "$RUNNER_TEMP/chart/oracle-mcp-server-$TAG.tgz" "oci://ghcr.io/$OWNER/charts"
          echo "Published oci://ghcr.io/$OWNER/charts/oracle-mcp-server:$TAG" >> "$GITHUB_STEP_SUMMARY"
