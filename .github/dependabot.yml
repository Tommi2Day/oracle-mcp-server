version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "monthly"
    ignore:
      # Types follow the Node.js LTS line used by the Docker image and CI
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
    groups:
      production:
        patterns: ["@modelcontextprotocol/*", "express", "zod"]
      toolchain:
        patterns: ["typescript", "typescript-eslint", "@typescript-eslint/*", "eslint", "@eslint/*", "tsx"]
      dev:
        patterns: ["*"]

  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "monthly"
    ignore:
      # Stay on the Node.js LTS line; bump the major version manually
      - dependency-name: "node"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
