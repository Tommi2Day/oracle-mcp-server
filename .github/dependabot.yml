version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "monthly"
    groups:
      production:
        patterns: ["@modelcontextprotocol/*", "express", "zod"]
      toolchain:
        patterns: ["typescript", "typescript-eslint", "@typescript-eslint/*", "eslint", "@eslint/*", "tsx"]
      dev:
        patterns: ["*"]

  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "monthly"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
