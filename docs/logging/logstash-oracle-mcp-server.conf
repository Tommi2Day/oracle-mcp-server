# Logstash pipeline for oracle-mcp-server logs shipped by Filebeat.
# See docs/logging.md for the log format and the matching Filebeat configuration.
#
# Resulting fields:
#   @timestamp            time of the log line (from the line, not the ingest time)
#   log.level             debug | info | warn | error
#   pgmcp.category        MCP | SESSION | AUTH | ADMIN | STORE | DB | HTTP | FATAL
#   pgmcp.token           token name (admin, anonymous or the file token name)
#   pgmcp.action          MCP tool, session start/stop or "<METHOD> <path>"
#   pgmcp.session         MCP session id (SESSION)
#   pgmcp.duration_s      session duration in seconds (SESSION stop)
#   pgmcp.result/.reason  denied / reason (AUTH)
#   pgmcp.params.*        tool parameters (MCP); params.sql only at LOG_LEVEL=debug
#   pgmcp.error           error message (MCP / ADMIN errors)
#   pgmcp.text            free text of unstructured categories (STORE, DB, HTTP, FATAL, stack traces)
#   source.ip             client IP

input {
  beats {
    port => 5044
  }
}

filter {
  # Only handle oracle-mcp-server events if the pipeline is shared with other services.
  # The field is set by the Filebeat configurations in docs/logging/.
  if [fields][service] == "oracle-mcp-server" {

    # The container runtime keeps the trailing newline of each line
    mutate { strip => ["message"] }

    grok {
      match => {
        "message" => "^\[%{TIMESTAMP_ISO8601:[@metadata][ts]}\] \[%{WORD:[log][level]}\] \[%{WORD:[@metadata][category]}\] (?<[@metadata][rest]>(?m).*)$"
      }
      # Startup banner and entrypoint messages have no prefix
      tag_on_failure => ["pgmcp_unstructured"]
    }

    if "pgmcp_unstructured" not in [tags] {
      date {
        match  => ["[@metadata][ts]", "ISO8601"]
        target => "@timestamp"
      }
      mutate { lowercase => ["[log][level]"] }
      # kv (target => "pgmcp") replaces the whole object, so the category is set afterwards

      if [@metadata][rest] =~ /^[a-z_]+="/ {
        # key="value" pairs, optionally followed by params={json} or error="json string"
        grok {
          match => {
            "[@metadata][rest]" => [
              "^%{DATA:[@metadata][kv]} params=(?<[@metadata][params]>\{.*\})$",
              "^%{DATA:[@metadata][kv]} error=(?<[@metadata][error]>\".*\")$",
              "^%{GREEDYDATA:[@metadata][kv]}$"
            ]
          }
        }
        kv {
          source      => "[@metadata][kv]"
          target      => "pgmcp"
          field_split => " "
          value_split => "="
        }
        if [@metadata][params] {
          json { source => "[@metadata][params]" target => "[pgmcp][params]" }
        }
        if [@metadata][error] {
          # error is a JSON string literal (quotes inside are escaped)
          json { source => "[@metadata][error]" target => "[pgmcp][error]" }
        }
        if [pgmcp][duration] {
          mutate { gsub => ["[pgmcp][duration]", "s$", ""] }
          mutate { rename => { "[pgmcp][duration]" => "[pgmcp][duration_s]" } }
          mutate { convert => { "[pgmcp][duration_s]" => "integer" } }
        }
        if [pgmcp][ip] {
          mutate { rename => { "[pgmcp][ip]" => "[source][ip]" } }
        }
      } else {
        # STORE, DB, HTTP, FATAL and debug stack traces: free text
        mutate { copy => { "[@metadata][rest]" => "[pgmcp][text]" } }
      }
      mutate { add_field => { "[pgmcp][category]" => "%{[@metadata][category]}" } }
    }
  }
}

output {
  elasticsearch {
    hosts => ["https://elasticsearch:9200"]
    index => "oracle-mcp-server-%{+yyyy.MM.dd}"
    # user / password / ssl settings as required by your cluster
  }
}
